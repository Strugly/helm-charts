# blockscout-stack values.yaml — Temtum Testnet
# Domain:      explorer.testnet.rhaegal.io  (frontend)
#              explorer-api.testnet.rhaegal.io  (backend)
# Chart:       blockscout/blockscout-stack
# Docs:        https://docs.blockscout.com/setup/deployment/kubernetes-deployment
#
# BEFORE DEPLOYING — fill in every value marked: # <-- REQUIRED
# Secrets (DATABASE_URL, SECRET_KEY_BASE) should ideally live in a K8s Secret
# and be referenced via blockscout.extraEnv / blockscout.envFrom rather than
# hardcoded here. See commented extraEnv examples below.

# ─── Global ──────────────────────────────────────────────────────────────────
nameOverride: "blockscout-temtum"
fullnameOverride: ""

config:
  network:
    id: 20251
    name: TemTum Testnet
    shortname: TemTum
    currency:
      name: TemTum
      symbol: TEM
      decimals: 18
      dualToken: false
  testnet: true
  account:
    enabled: false           # set true + add Redis if you want user accounts
  nameService:
    enabled: false
  prometheus:
    enabled: false           # set true if you have Prometheus Operator installed
    ingressWhitelist:
      enabled: false

# ─── Backend ─────────────────────────────────────────────────────────────────
blockscout:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/blockscout/blockscout
    pullPolicy: IfNotPresent
    tag: "latest"            # pin to a specific release tag for production

  init:
    enabled: true
    command: ["/bin/sh"]
    args:
      - -c
      - bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()"

  # ── Backend ENV vars ───────────────────────────────────────────────────────
  # Required vars. Sensitive ones (DATABASE_URL, SECRET_KEY_BASE) are shown
  # here for clarity — move them to a K8s Secret + use extraEnv/envFrom in prod.
  env:
    # ── Required ──────────────────────────────────────────────────────────
    ETHEREUM_JSONRPC_VARIANT: "besu"
    ETHEREUM_JSONRPC_HTTP_URL: "http://10.0.1.188:8545"
    ETHEREUM_JSONRPC_TRACE_URL: "http://10.0.1.188:8545"  # besu uses the same endpoint for trace
    ETHEREUM_JSONRPC_WS_URL: "ws://10.0.1.188:8546"       # <-- confirm WS port with your besu config

    # ── Chain identity ────────────────────────────────────────────────────
    COIN: "TEM"
    COIN_NAME: "TemTum"
    CHAIN_ID: "20251"
    NETWORK: "TemTum"
    SUBNETWORK: "Testnet"

    # ── Backend host (used in API example URLs) ───────────────────────────
    BLOCKSCOUT_HOST: "explorer-api.testnet.rhaegal.io"
    BLOCKSCOUT_PROTOCOL: "https"

    # ── Frontend URL (for CORS and redirect) ─────────────────────────────
    WEBAPP_URL: "https://explorer.testnet.rhaegal.io"

    # ── Logging ──────────────────────────────────────────────────────────
    DISABLE_FILE_LOGGING: "true"   # stdout only in k8s
    LOG_LEVEL: "warn"

    # ── Indexer ───────────────────────────────────────────────────────────
    APPLICATION_MODE: "all"        # runs both indexer + API; split with separateApi if needed
    INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "false"
    FETCH_REWARDS_WAY: "trace_block"  # besu supports trace_block

    # ── API ───────────────────────────────────────────────────────────────
    API_V2_ENABLED: "true"
    DISABLE_INDEXER: "false"

  # ── Secrets — better via K8s Secret, but shown inline for starter clarity ─
  # Option A: inline (NOT for production — visible in git/CI)
  envFromSecret:
    DATABASE_URL: "postgres://dbadmin:<PASSWORD>@temtumttn1db.postgres.database.azure.com/postgres"
    SECRET_KEY_BASE: ""   # <-- REQUIRED: generate with `mix phx.gen.secret` or `openssl rand -base64 64`

  # Option B (recommended for production): reference an existing K8s Secret
  # Create with:
  #   kubectl create secret generic blockscout-backend-secret \
  #     --from-literal=DATABASE_URL='postgres://dbadmin:<PASSWORD>@...' \
  #     --from-literal=SECRET_KEY_BASE='<generated>'
  # Then comment out envFromSecret above and uncomment:
  # envFrom:
  #   - secretRef:
  #       name: blockscout-backend-secret

  # ── Ingress ───────────────────────────────────────────────────────────────
  ingress:
    enabled: true
    className: "nginx"       # adjust to your ingress class (e.g. "traefik", "alb")
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
      # Uncomment if using cert-manager:
      # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hostname: "explorer-api.testnet.rhaegal.io"
    tls:
      enabled: true
      secretName: "blockscout-backend-tls"
    paths:
      - path: /api
        pathType: Prefix
      - path: /socket
        pathType: Prefix
      - path: /public-metrics
        pathType: Prefix
      - path: /auth/auth0
        pathType: Exact
      - path: /auth/auth0/callback
        pathType: Exact
      - path: /auth/logout
        pathType: Exact

  service:
    type: ClusterIP
    port: 80

  resources:
    limits:
      cpu: 2
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

  livenessProbe:
    enabled: true
    path: /api/health/liveness
    params:
      initialDelaySeconds: 120
      periodSeconds: 60
      timeoutSeconds: 30

  readinessProbe:
    enabled: true
    path: /api/health/readiness
    params:
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 30

  terminationGracePeriodSeconds: 300

# ─── Frontend ─────────────────────────────────────────────────────────────────
frontend:
  enabled: true
  replicaCount: 2

  image:
    repository: ghcr.io/blockscout/frontend
    pullPolicy: IfNotPresent
    tag: "latest"            # pin to a specific release tag for production

  # ── Frontend ENV vars ──────────────────────────────────────────────────────
  # IMPORTANT: these live at the `frontend:` root, NOT nested under `blockscout:`
  # All NEXT_PUBLIC_* vars are exposed to the browser — no secrets here.
  env:
    # ── App ───────────────────────────────────────────────────────────────
    NEXT_PUBLIC_APP_PROTOCOL: "https"
    NEXT_PUBLIC_APP_HOST: "explorer.testnet.rhaegal.io"
    NEXT_PUBLIC_APP_ENV: "production"

    # ── API connection (frontend → backend) ───────────────────────────────
    NEXT_PUBLIC_API_HOST: "explorer-api.testnet.rhaegal.io"
    NEXT_PUBLIC_API_PROTOCOL: "https"
    NEXT_PUBLIC_API_BASE_PATH: "/"
    NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL: "wss"

    # ── Chain / network identity ──────────────────────────────────────────
    NEXT_PUBLIC_NETWORK_NAME: "TemTum Testnet"
    NEXT_PUBLIC_NETWORK_SHORT_NAME: "TemTum"
    NEXT_PUBLIC_NETWORK_ID: "20251"
    NEXT_PUBLIC_NETWORK_CURRENCY_NAME: "TemTum"
    NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: "TEM"
    NEXT_PUBLIC_NETWORK_CURRENCY_DECIMALS: "18"
    NEXT_PUBLIC_IS_TESTNET: "true"

    # ── RPC URL for wallet "Add Network" button ───────────────────────────
    # Use a public-facing RPC here (not your internal 10.0.1.188)
    NEXT_PUBLIC_NETWORK_RPC_URL: ""  # <-- REQUIRED: e.g. https://rpc.testnet.rhaegal.io

    # ── Verification type ─────────────────────────────────────────────────
    NEXT_PUBLIC_NETWORK_VERIFICATION_TYPE: "validation"  # or "mining" depending on besu config

    # ── UI tweaks ─────────────────────────────────────────────────────────
    NEXT_PUBLIC_HOMEPAGE_CHARTS: "['daily_txs']"
    NEXT_PUBLIC_HOMEPAGE_STATS: "['total_blocks','average_block_time','total_txs','wallet_addresses']"

  # ── Ingress ───────────────────────────────────────────────────────────────
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hostname: "explorer.testnet.rhaegal.io"
    tls:
      enabled: true
      secretName: "blockscout-frontend-tls"
    paths:
      - path: /
        pathType: Prefix

  service:
    type: ClusterIP
    port: 80

  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "256Mi"

  livenessProbe:
    enabled: true
    path: /api/healthz
    params:
      initialDelaySeconds: 100
      periodSeconds: 60
      timeoutSeconds: 30

  readinessProbe:
    enabled: true
    path: /api/healthz
    params:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 30

# ─── Stats service (optional — disable for initial deploy) ───────────────────
stats:
  enabled: false
  # Enable later with:
  #   env:
  #     STATS__DB_URL: "postgres://dbadmin:<PASSWORD>@temtumttn1db.postgres.database.azure.com/blockscout_stats"
  #     STATS__BLOCKSCOUT_DB_URL: "postgres://dbadmin:<PASSWORD>@temtumttn1db.postgres.database.azure.com/postgres"
  #     STATS__SERVER__HTTP__CORS__ENABLED: "true"
  #     STATS__SERVER__HTTP__CORS__ALLOWED_ORIGIN: "https://explorer.testnet.rhaegal.io"
  # ingress:
  #   enabled: true
  #   hostname: "explorer-stats.testnet.rhaegal.io"

# ─── Disabled optional components ────────────────────────────────────────────
userOpsIndexer:
  enabled: false

# ─── Service account ─────────────────────────────────────────────────────────
serviceAccount:
  create: true
  annotations: {}
  name: ""

nodeSelector: {}
tolerations: []
affinity: {}